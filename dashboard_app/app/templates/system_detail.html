{% extends "base.html" %}

{% block title %}{{ system.name }} - KPI Dashboard{% endblock %}

{% block page_title %}{{ system.name }}{% endblock %}

{% block content %}
<div id="system-detail-container"
     sse-listen="datachanged"

     hx-swap="innerHTML">
    {% include 'partials/_system_detail_content.html' %}
</div>
{% endblock %}
